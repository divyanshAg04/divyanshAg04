<!-- Animated SVG banner: assets/banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#7928ca">
      <animate attributeName="stop-color" values="#7928ca;#ff0080;#00d4ff;#7928ca" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0080">
      <animate attributeName="stop-color" values="#ff0080;#00d4ff;#7928ca;#ff0080" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
  <g filter="url(#shadow)">
    <text x="50%" y="55%" text-anchor="middle" fill="url(#g)" font-family="Segoe UI, Roboto, Arial" font-size="56" font-weight="700">
      Divyansh Agrawal
      <animate attributeName="x" values="50%;50%" dur="1s" />
    </text>
  </g>
  <text x="50%" y="80%" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial" font-size="18">
    Full‑Stack Developer • Systems & DevOps Enthusiast • DSA
  </text>
</svg>